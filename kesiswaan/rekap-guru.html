<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Absensi - Sistem Absensi</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 25px; }
        .input-group label { color: var(--text-gray); font-size: 13px; font-weight: 500;}
        .input-group input { border: 1px solid #e2e8f0; padding: 12px 15px; border-radius: var(--radius-sm); outline: none; font-family: 'Poppins'; font-size: 13px; color: var(--text-dark);}
        .input-group input:focus { border-color: var(--primary-purple); }
        .btn-full { width: 100%; padding: 14px; border-radius: var(--radius-sm); cursor: pointer; font-family: 'Poppins'; font-weight: 500; font-size: 13px; margin-bottom: 12px; border: none; transition: 0.3s; display: flex; justify-content: center; align-items: center; gap: 10px;}
        .btn-pdf { background-color: var(--primary-purple); color: white; box-shadow: 0 4px 15px rgba(139, 92, 246, 0.2); }
        .btn-pdf:hover { background-color: var(--primary-purple-hover); transform: translateY(-2px);}
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h3>KESISWAAN</h3> <h4>MANAJEMEN DATA</h4> <p>SMK 1 INDONESIA</p>
        </div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="absen-guru.html"><i class="fas fa-check-circle"></i> Absensi Guru</a></li>
            <li><a href="validasi-data.html"><i class="fas fa-clipboard-check"></i> Validasi Data</a></li>
            <li class="active"><a href="rekap-guru.html"><i class="fas fa-file-alt"></i> Rekap Absensi Guru</a></li>
            <li><a href="profil.html"><i class="fas fa-user-circle"></i> Profil & Akun</a></li>
        </ul>
    </aside>

    <main class="main-content">
        <div class="page-header-top" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div style="display: flex; align-items: center;">
                <button class="menu-toggle"><i class="fas fa-bars"></i></button>
                <div>
                    <h2 style="font-size: 24px; color: var(--text-dark); font-weight: 600;">Rekapitulasi Absensi Guru</h2>
                    <p style="font-size: 13px; color: var(--text-gray);">Cetak laporan kehadiran Staf Pengajar</p>
                </div>
            </div>
        </div>

        <div class="data-card" style="max-width: 500px; padding: 30px;">
            <h3 style="color: var(--text-dark); font-weight: 600; font-size: 18px; margin-bottom: 5px;">Filter Laporan</h3>
            <p style="font-size: 13px; color: var(--text-gray); margin-bottom: 25px;">Pilih periode bulan yang akan dicetak</p>
            
            <div class="input-group">
                <label>Pilih Bulan & Tahun :</label>
                <input type="month" value="2026-09">
            </div>
            
            <button class="btn-full btn-pdf"><i class="fas fa-file-pdf"></i> Generate File PDF</button>
            <button class="btn-full" style="background: #f1f5f9; color: var(--primary-purple);"><i class="fas fa-file-word"></i> Generate File Word (DOC)</button>
        </div>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", function() { const overlay = document.createElement('div'); overlay.className = 'sidebar-overlay'; document.body.appendChild(overlay); const sidebar = document.querySelector('.sidebar'); const menuBtn = document.querySelector('.menu-toggle'); if(menuBtn) { menuBtn.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('show'); }); } overlay.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('show'); }); });
    </script>
</body>
</html>
