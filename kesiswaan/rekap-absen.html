<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Absensi - Sistem Absensi</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .filter-row { display: flex; gap: 20px; margin-bottom: 25px; border-bottom: 1px solid #f1f5f9; padding-bottom: 25px; flex-wrap: wrap; align-items: flex-end;}
        .filter-group { flex: 1; min-width: 180px; }
        .filter-group label { display: block; font-size: 12px; color: var(--text-gray); margin-bottom: 8px; font-weight: 600;}
        .filter-group input, .filter-group select { width: 100%; padding: 10px 15px; border: 1px solid #cbd5e1; border-radius: var(--radius-sm); outline: none; font-family: 'Poppins'; font-size: 13px; font-weight: 500; color: var(--text-dark);}
        .filter-group select:focus, .filter-group input:focus { border-color: var(--primary-purple); box-shadow: 0 0 0 3px rgba(139, 92, 246, 0.1); }
        
        .btn-export { background-color: #f1f5f9; color: var(--primary-purple); border: none; padding: 10px 15px; border-radius: var(--radius-sm); cursor: pointer; font-size: 13px; font-weight: 600; font-family: 'Poppins'; transition: 0.3s; display: inline-flex; align-items: center; gap: 8px;}
        .btn-export:hover { background-color: var(--primary-purple); color: white;}
        .btn-export.pdf { background-color: #fee2e2; color: #dc2626; }
        .btn-export.pdf:hover { background-color: #dc2626; color: white; }
        .btn-export.excel { background-color: #d1fae5; color: #059669; }
        .btn-export.excel:hover { background-color: #059669; color: white; }

        .summary-badges { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .s-badge { padding: 10px 15px; border-radius: 8px; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h3>KESISWAAN</h3> <h4>MANAJEMEN DATA</h4> <p>SMK 1 INDONESIA</p>
        </div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="absen-guru.html"><i class="fas fa-user-check"></i> Validasi Absen Guru</a></li>
            <li><a href="validasi-data.html"><i class="fas fa-clipboard-check"></i> Validasi Absen Siswa</a></li>
            <!-- Nama menu diubah jadi gabungan -->
            <li class="active"><a href="rekap-absen.html"><i class="fas fa-file-alt"></i> Rekap Absensi</a></li>
            <li><a href="profil.html"><i class="fas fa-user-circle"></i> Profil & Akun</a></li>
        </ul>
        <div style="margin-top: auto; padding: 20px;">
            <a href="#" onclick="prosesLogout()" style="display: flex; align-items: center; padding: 12px 20px; background: #fef2f2; color: #EF4444; text-decoration: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; border: 1px solid #fee2e2; transition: 0.3s;">
                <i class="fas fa-sign-out-alt" style="margin-right: 15px; font-size: 18px;"></i> Keluar
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header-top" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div style="display: flex; align-items: center;">
                <button class="menu-toggle"><i class="fas fa-bars"></i></button>
                <div>
                    <h2 style="font-size: 24px; color: var(--text-dark); font-weight: 600;">Rekapitulasi Absensi</h2>
                    <p style="font-size: 13px; color: var(--text-gray);">Pusat unduh laporan kehadiran Guru dan Siswa</p>
                </div>
            </div>
            <div style="display: flex; align-items: center; gap: 10px;">
                <button class="btn-export pdf"><i class="fas fa-file-pdf"></i> Export PDF</button>
                <button class="btn-export excel"><i class="fas fa-file-excel"></i> Export Excel</button>
            </div>
        </div>

        <div class="data-card" style="padding: 25px;">
            <!-- Filter Dinamis -->
            <div class="filter-row">
                <div class="filter-group">
                    <label>Tipe Laporan</label>
                    <select id="pilihTipe" onchange="ubahTampilanRekap()">
                        <option value="guru">Data Absensi Guru</option>
                        <option value="siswa">Data Absensi Siswa</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>Periode Bulan</label>
                    <input type="month" value="2026-09">
                </div>
                <!-- Dropdown Kelas (Disembunyikan secara default, hanya muncul jika pilih Siswa) -->
                <div class="filter-group" id="filterKelasArea" style="display: none;">
                    <label>Pilih Kelas</label>
                    <select>
                        <option>X.1</option>
                        <option>X.2</option>
                        <option>XI.1</option>
                        <option>XII.1</option>
                    </select>
                </div>
                <div>
                    <button class="btn-purple" style="height: 42px; padding: 0 20px;" onclick="muatData()"><i class="fas fa-filter"></i> Terapkan</button>
                </div>
            </div>

            <!-- Ringkasan Singkat -->
            <div class="summary-badges">
                <div class="s-badge" style="background: #d1fae5; color: #065f46;"><i class="fas fa-calendar-check"></i> Total Hari Efektif: 22 Hari</div>
                <div class="s-badge" id="badgeTotalData" style="background: #f3e8ff; color: var(--primary-purple);"><i class="fas fa-users"></i> Menampilkan: 22 Guru</div>
            </div>

            <!-- Tabel Dinamis -->
            <div class="table-container" style="padding: 0; box-shadow: none;">
                <table class="data-table">
                    <thead id="tabelHeader">
                        <!-- Header akan di-generate oleh JS -->
                    </thead>
                    <tbody id="tabelBody">
                        <!-- Data akan di-generate oleh JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // Data Dummy untuk Guru
        const dataGuru = [
            { id: "17272537569", nama: "Anastasia Pertiwi, S.Pd", h: 22, i: 0, s: 0, a: 0 },
            { id: "82050507640", nama: "Budi Santoso, S.Kom", h: 20, i: 2, s: 0, a: 0 },
            { id: "46356789012", nama: "Tari Novitasari, M.Pd", h: 21, i: 0, s: 1, a: 0 },
            { id: "23433632392", nama: "Yuliana Almira, S.T.", h: 22, i: 0, s: 0, a: 0 },
            { id: "83247618992", nama: "Reza Aditya, S.E.", h: 19, i: 1, s: 1, a: 1 }
        ];

        // Data Dummy untuk Siswa
        const dataSiswa = [
            { id: "0146886", nama: "Almira Pratiwi", h: 22, i: 0, s: 0, a: 0 },
            { id: "2679240", nama: "Amelia Wijayanti", h: 20, i: 1, s: 1, a: 0 },
            { id: "6084227", nama: "Cahya Wacana", h: 21, i: 0, s: 0, a: 1 },
            { id: "4290352", nama: "Candra Dabukke", h: 22, i: 0, s: 0, a: 0 },
            { id: "1234567", nama: "Ferdy Pepey", h: 18, i: 2, s: 2, a: 0 }
        ];

        // Fungsi Utama untuk mengubah Kolom Tabel dan Filter
        function ubahTampilanRekap() {
            let tipe = document.getElementById('pilihTipe').value;
            let filterKelasArea = document.getElementById('filterKelasArea');
            let thead = document.getElementById('tabelHeader');
            let tbody = document.getElementById('tabelBody');
            let badgeTotal = document.getElementById('badgeTotalData');

            tbody.innerHTML = ""; // Bersihkan tabel

            if (tipe === 'siswa') {
                // TAMPILAN SISWA
                filterKelasArea.style.display = 'block'; // Munculkan filter kelas
                badgeTotal.innerHTML = `<i class="fas fa-user-graduate"></i> Menampilkan: 36 Siswa (Kelas X.1)`;
                
                thead.innerHTML = `
                    <tr>
                        <th>No</th> <th>NIS</th> <th style="text-align: left;">Nama Siswa</th> 
                        <th>Hadir</th> <th>Izin</th> <th>Sakit</th> <th>Alpa</th>
                    </tr>
                `;

                dataSiswa.forEach((item, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${index + 1}</td> <td>${item.id}</td> <td style="text-align: left; font-weight: 500;">${item.nama}</td>
                            <td><span style="color: var(--primary-green); font-weight: 600;">${item.h}</span></td>
                            <td><span style="color: var(--primary-cyan); font-weight: 600;">${item.i}</span></td>
                            <td><span style="color: var(--warning-orange); font-weight: 600;">${item.s}</span></td>
                            <td><span style="color: var(--danger-red); font-weight: 600;">${item.a}</span></td>
                        </tr>
                    `;
                });

            } else {
                // TAMPILAN GURU
                filterKelasArea.style.display = 'none'; // Sembunyikan filter kelas
                badgeTotal.innerHTML = `<i class="fas fa-chalkboard-teacher"></i> Menampilkan: 22 Guru`;

                thead.innerHTML = `
                    <tr>
                        <th>No</th> <th>NUPTK</th> <th style="text-align: left;">Nama Guru</th> 
                        <th>Hadir</th> <th>Izin</th> <th>Sakit</th> <th>Alpa</th>
                    </tr>
                `;

                dataGuru.forEach((item, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${index + 1}</td> <td>${item.id}</td> <td style="text-align: left; font-weight: 500;">${item.nama}</td>
                            <td><span style="color: var(--primary-green); font-weight: 600;">${item.h}</span></td>
                            <td><span style="color: var(--primary-cyan); font-weight: 600;">${item.i}</span></td>
                            <td><span style="color: var(--warning-orange); font-weight: 600;">${item.s}</span></td>
                            <td><span style="color: var(--danger-red); font-weight: 600;">${item.a}</span></td>
                        </tr>
                    `;
                });
            }
        }

        // Animasi saat tombol terapkan diklik
        function muatData() {
            let tbody = document.getElementById('tabelBody');
            tbody.style.opacity = '0.3';
            setTimeout(() => {
                ubahTampilanRekap();
                tbody.style.opacity = '1';
            }, 300);
        }

        // Jalankan saat halaman pertama kali dibuka
        window.onload = ubahTampilanRekap;

        // Logout & Sidebar
        function prosesLogout() { if(confirm("Apakah Anda yakin ingin keluar dari sistem?")) window.location.href = '../login.html'; }
        document.addEventListener("DOMContentLoaded", function() { const overlay = document.createElement('div'); overlay.className = 'sidebar-overlay'; document.body.appendChild(overlay); const sidebar = document.querySelector('.sidebar'); const menuBtn = document.querySelector('.menu-toggle'); if(menuBtn) { menuBtn.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('show'); }); } overlay.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('show'); }); });
    </script>
</body>
</html>
