<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rekap Absensi - Sistem Absensi</title>
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .card-flat { background: #fff; border-radius: var(--radius-lg); box-shadow: 0 4px 20px rgba(0,0,0,0.05); overflow: hidden; margin-bottom: 30px; border: 1px solid #f1f5f9; }
        
        /* HEADER PURPLE FLEX */
        .card-header-purple { background: var(--primary-purple); padding: 25px 30px; display: flex; justify-content: space-between; align-items: flex-start; gap: 15px; }
        .header-title-area h3 { color: #fff; font-size: 20px; font-weight: 600; margin: 0 0 5px 0; }
        .header-title-area p { color: rgba(255,255,255,0.8); font-size: 13px; margin: 0; font-weight: 500;}
        
        .export-btns { display: flex; gap: 10px; flex-shrink: 0; flex-wrap: wrap; justify-content: flex-end;}
        .btn-white { background: #fff; color: var(--primary-purple); border: none; padding: 10px 15px; border-radius: 8px; font-weight: 600; font-family: 'Poppins'; font-size: 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; transition: 0.3s; box-shadow: 0 4px 10px rgba(0,0,0,0.1);}
        .btn-white:hover { background: #f8fafc; transform: translateY(-2px); }
        .btn-white.excel { color: #059669; }

        .card-body { padding: 30px; }
        
        /* FILTER FLAT (DESKTOP) */
        .filter-flat { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 25px; border-bottom: 1px solid #f1f5f9; padding-bottom: 25px; align-items: flex-end;}
        .filter-group { flex: 1; min-width: 160px; }
        .filter-btn-area { width: 150px; }
        
        .filter-group label { display: block; font-size: 13px; color: var(--text-gray); font-weight: 600; margin-bottom: 8px; }
        .filter-group select, .filter-group input { width: 100%; padding: 12px 15px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: 'Poppins'; font-size: 14px; color: var(--text-dark); font-weight: 600; outline: none; transition: 0.3s; box-sizing: border-box;}
        .filter-group select:focus, .filter-group input:focus { border-color: var(--primary-purple); }

        .table-flat { width: 100%; border-collapse: collapse; }
        .table-flat thead { background-color: #f8fafc; }
        .table-flat th { padding: 18px 15px; font-size: 12px; font-weight: 700; color: #334155; text-transform: uppercase; letter-spacing: 1px; text-align: center; border: none; }
        .table-flat th.left { text-align: left; }
        .table-flat td { padding: 20px 15px; font-size: 14px; color: var(--text-dark); text-align: center; border-bottom: 1px solid #f1f5f9; font-weight: 500; }
        .table-flat td.left { text-align: left; }

        .txt-hadir { color: var(--primary-green); font-weight: 700; }
        .txt-sakit { color: #f59e0b; font-weight: 700; }
        .txt-izin { color: var(--primary-cyan); font-weight: 700; }
        .txt-alpa { color: var(--danger-red); font-weight: 700; }

        /* TAMPILAN MOBILE KHUSUS SESUAI GAMBAR */
        @media (max-width: 768px) {
            .card-header-purple { 
                flex-direction: row; /* Tetap sejajar kiri-kanan */
                align-items: center;
                padding: 20px;
            }
            .header-title-area h3 { font-size: 16px; }
            .header-title-area p { font-size: 11px; }
            
            /* Tombol Export di Kanan */
            .export-btns { flex-direction: column; gap: 8px; }
            .btn-white { padding: 8px 12px; font-size: 11px; }

            /* Filter Kanan Kiri & Tombol Full */
            .filter-flat { 
                display: grid; 
                grid-template-columns: 1fr 1fr; 
                gap: 15px; 
            }
            .filter-group.full-width-mobile { grid-column: span 2; }
            .filter-group.half-width-mobile { grid-column: span 1; min-width: 0; }
            .filter-btn-area { grid-column: span 2; width: 100%; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="sidebar-header">
            <h3>KESISWAAN</h3> <h4>MANAJEMEN DATA</h4> <p>SMA 4 KARAWANG</p>
        </div>
        <ul class="sidebar-menu">
            <li><a href="index.html"><i class="fas fa-home"></i> Dashboard</a></li>
            <li><a href="absen-guru.html"><i class="fas fa-user-check"></i> Validasi Absen Guru</a></li>
            <li><a href="validasi-data.html"><i class="fas fa-clipboard-check"></i> Validasi Absen Siswa</a></li>
            <li class="active"><a href="rekap-absen.html"><i class="fas fa-file-alt"></i> Rekap Absensi</a></li>
            <li><a href="profil.html"><i class="fas fa-user-circle"></i> Profil & Akun</a></li>
        </ul>
        <div style="margin-top: auto; padding: 20px;">
            <a href="#" onclick="prosesLogout()" style="display: flex; align-items: center; padding: 12px 20px; background: #fef2f2; color: #EF4444; text-decoration: none; border-radius: var(--radius-sm); font-size: 13px; font-weight: 600; border: 1px solid #fee2e2;">
                <i class="fas fa-sign-out-alt" style="margin-right: 15px; font-size: 18px;"></i> Keluar
            </a>
        </div>
    </aside>

    <main class="main-content">
        <div class="page-header-top" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <div style="display: flex; align-items: center;">
                <button class="menu-toggle"><i class="fas fa-bars"></i></button>
                <div>
                    <h2 style="font-size: 24px; color: var(--text-dark); font-weight: 600;">Rekapitulasi Absensi</h2>
                    <p style="font-size: 13px; color: var(--text-gray);">Pusat unduh laporan kehadiran Guru dan Siswa</p>
                </div>
            </div>
        </div>

        <div class="card-flat">
            <div class="card-header-purple">
                <div class="header-title-area">
                    <h3 id="judulTabel">Riwayat Absensi Guru</h3>
                    <p id="subJudulTabel">Rentang: Januari 2026 - Maret 2026</p>
                </div>
                <!-- Tombol Export pindah ke kanan atas sesuai referensi -->
                <div class="export-btns">
                    <button class="btn-white"><i class="fas fa-file-pdf"></i> Export PDF</button>
                    <button class="btn-white excel"><i class="fas fa-file-excel"></i> Export Excel</button>
                </div>
            </div>

            <div class="card-body">
                <div class="filter-flat">
                    <!-- Tipe Laporan (Full di Mobile) -->
                    <div class="filter-group full-width-mobile">
                        <label>Tipe Laporan</label>
                        <select id="pilihTipe" onchange="ubahTampilanRekap()">
                            <option value="guru">Data Guru</option>
                            <option value="siswa">Data Siswa</option>
                        </select>
                    </div>
                    
                    <!-- Rentang Bulan (Kanan Kiri di Mobile) -->
                    <div class="filter-group half-width-mobile">
                        <label>Dari Bulan</label>
                        <!-- Diubah ke type="month" -->
                        <input type="month" id="tglMulai" value="2026-01">
                    </div>
                    <div class="filter-group half-width-mobile">
                        <label>Sampai Bulan</label>
                        <!-- Diubah ke type="month" -->
                        <input type="month" id="tglAkhir" value="2026-03">
                    </div>

                    <!-- Dropdown Kelas (Disembunyikan default) -->
                    <div class="filter-group full-width-mobile" id="filterKelasArea" style="display: none;">
                        <label>Pilih Kelas</label>
                        <select id="pilihKelas">
                            <option>X.1</option>
                            <option>X.2</option>
                            <option>XI.1</option>
                        </select>
                    </div>
                    
                    <!-- Tombol Terapkan (Full di Mobile) -->
                    <div class="filter-btn-area">
                        <button class="btn-purple" style="width: 100%; height: 46px; border-radius: 8px;" onclick="muatData()"><i class="fas fa-filter"></i> Terapkan</button>
                    </div>
                </div>

                <div style="overflow-x: auto;">
                    <table class="table-flat">
                        <thead id="tabelHeader">
                            <!-- Diisi oleh JS -->
                        </thead>
                        <tbody id="tabelBody">
                            <!-- Diisi oleh JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const dataGuru = [
            { id: "17272537569", nama: "Anastasia Pertiwi, S.Pd", h: 66, i: 1, s: 2, a: 0 },
            { id: "82050507640", nama: "Budi Santoso, S.Kom", h: 60, i: 5, s: 0, a: 0 },
            { id: "46356789012", nama: "Tari Novitasari, M.Pd", h: 65, i: 0, s: 3, a: 0 }
        ];

        const dataSiswa = [
            { id: "0146886", nama: "Almira Pratiwi", h: 68, i: 0, s: 0, a: 0 },
            { id: "2679240", nama: "Amelia Wijayanti", h: 62, i: 3, s: 2, a: 0 },
            { id: "6084227", nama: "Budi Santoso", h: 65, i: 1, s: 1, a: 1 }
        ];

        // Fungsi mengubah format YYYY-MM menjadi "NamaBulan Tahun"
        function formatBulan(val) {
            if(!val) return "";
            let parts = val.split('-');
            let bln = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
            return bln[parseInt(parts[1]) - 1] + " " + parts[0];
        }

        function ubahTampilanRekap() {
            let tipe = document.getElementById('pilihTipe').value;
            let filterKelasArea = document.getElementById('filterKelasArea');
            let thead = document.getElementById('tabelHeader');
            let tbody = document.getElementById('tabelBody');
            
            // Format rentang bulan menggunakan fungsi formatBulan
            let tglM = formatBulan(document.getElementById('tglMulai').value);
            let tglA = formatBulan(document.getElementById('tglAkhir').value);

            tbody.innerHTML = ""; 

            if (tipe === 'siswa') {
                let kelas = document.getElementById('pilihKelas').value;
                filterKelasArea.style.display = 'block';
                document.getElementById('judulTabel').innerText = "Riwayat Absensi Siswa";
                document.getElementById('subJudulTabel').innerText = `Kelas: ${kelas} | Rentang: ${tglM} s/d ${tglA}`;
                
                thead.innerHTML = `<tr> <th>NO</th> <th>NIS</th> <th class="left">NAMA SISWA</th> <th>HADIR</th> <th>SAKIT</th> <th>IZIN</th> <th>ALPA</th> </tr>`;

                dataSiswa.forEach((item, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${index + 1}</td> <td>${item.id}</td> <td class="left" style="font-weight: 600;">${item.nama}</td>
                            <td class="txt-hadir">${item.h}</td> <td class="txt-sakit">${item.s}</td> 
                            <td class="txt-izin">${item.i}</td> <td class="txt-alpa">${item.a}</td>
                        </tr>
                    `;
                });
            } else {
                filterKelasArea.style.display = 'none';
                document.getElementById('judulTabel').innerText = "Riwayat Absensi Guru";
                document.getElementById('subJudulTabel').innerText = `Rentang: ${tglM} s/d ${tglA}`;

                thead.innerHTML = `<tr> <th>NO</th> <th>NUPTK</th> <th class="left">NAMA GURU</th> <th>HADIR</th> <th>SAKIT</th> <th>IZIN</th> <th>ALPA</th> </tr>`;

                dataGuru.forEach((item, index) => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${index + 1}</td> <td>${item.id}</td> <td class="left" style="font-weight: 600;">${item.nama}</td>
                            <td class="txt-hadir">${item.h}</td> <td class="txt-sakit">${item.s}</td> 
                            <td class="txt-izin">${item.i}</td> <td class="txt-alpa">${item.a}</td>
                        </tr>
                    `;
                });
            }
        }

        function muatData() {
            let tbody = document.getElementById('tabelBody');
            tbody.style.opacity = '0.3';
            setTimeout(() => { ubahTampilanRekap(); tbody.style.opacity = '1'; }, 300);
        }

        window.onload = ubahTampilanRekap;

        function prosesLogout() { if(confirm("Keluar dari sistem?")) window.location.href = '../login.html'; }
        document.addEventListener("DOMContentLoaded", function() { const overlay = document.createElement('div'); overlay.className = 'sidebar-overlay'; document.body.appendChild(overlay); const sidebar = document.querySelector('.sidebar'); const menuBtn = document.querySelector('.menu-toggle'); if(menuBtn) { menuBtn.addEventListener('click', () => { sidebar.classList.add('active'); overlay.classList.add('show'); }); } overlay.addEventListener('click', () => { sidebar.classList.remove('active'); overlay.classList.remove('show'); }); });
    </script>
</body>
</html>
